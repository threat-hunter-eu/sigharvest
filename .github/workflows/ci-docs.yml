# Every `<!-- doctest -->` shell example in README.md and docs/*.md runs against an offline fixture workspace
# (tests/test_docs.py), so the docs cannot drift from the CLI. Unmarked blocks, broken relative links and broken
# tables already fail the pytest job of ci.yml on every push. Runs on every pull request to main (docs-only ones
# included), daily when SIGHARVEST_FULL_CI_ENABLED is `true`, and on demand. docs/automation.md#what-runs-when.
name: CI (docs examples)

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '41 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: docs examples (${{ matrix.extra }})
    if: github.event_name != 'schedule' || vars.SIGHARVEST_FULL_CI_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        extra: [convert, convert-legacy]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.6' # uv itself; bump with the action (checksum known to it)
          python-version: '3.12'
      - name: Install (${{ matrix.extra }})
        env:
          EXTRA: ${{ matrix.extra }}
        run: |
          if [ "$EXTRA" = convert ]; then
            uv sync --locked
          else
            uv sync --locked --no-default-groups --group test --extra "$EXTRA"
          fi
      - name: pytest -m docs (a skipped test is a failure here)
        run: |
          set -euo pipefail
          command -v jq
          uv run --no-sync pytest -n auto -rA -m docs tests/test_docs.py --junitxml "$RUNNER_TEMP/docs.xml"
          python3 - "$RUNNER_TEMP/docs.xml" <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          suites = [root] if root.tag == "testsuite" else list(root)
          tests = sum(int(s.get("tests", 0)) for s in suites)
          skipped = sum(int(s.get("skipped", 0)) for s in suites)
          print(f"docs tests: {tests}, skipped: {skipped}")
          if tests == 0 or skipped:
              sys.exit("docs tests were skipped or none ran")
          PY
