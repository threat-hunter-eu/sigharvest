name: Bug report
description: Something in sigharvest does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security problems: please use the Security tab (private report), not an issue. See SECURITY.md.
        Rule content problems (false positives, wrong tags) belong to the rule's source repository.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Command or page, what you expected, what you got (paste the output).
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Smallest rule, log or steps that show it. Remove tokens, internal hostnames and private paths first.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: sigharvest --version
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else (rule keys from `sigharvest search`, Python version, OS)
